# Optional local Postgres, for offline development without hitting Supabase.
# Local URL: postgresql://postgres:password@localhost:5432/blog_db?sslmode=disable
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d blog_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
